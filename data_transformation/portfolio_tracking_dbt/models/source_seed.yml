version: 2

## define an external data source to read our seeds in a metadata-driven way so that we can easily adapt if the data would stop coming from a seed and start to come from a different place
sources:
  - name: seeds
    schema: "{{target.schema}}_SEED_DATA"
    tables:
      - name: ABC_Bank_SECURITY_INFO
        columns:
          - name: SECURITY_CODE
            tests:
              - not_null
              - unique
          - name: SECURITY_NAME
            tests:
              - not_null
              - not_empty
      - name: ABC_Bank_EXCHANGE_INFO
      # - name: ABC_Bank_COUNTRY_INFO
      # - name: ABC_Bank_INDUSTRY_INFO
      # - name: ABC_Bank_SECTOR_INFO