
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'portfolio_tracking_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project out of all profiles in profiles.yml.
profile: 'portfolio_tracking_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  portfolio_tracking_dbt:
    +materialized: view
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: view
    staging:    # Data storage layer
      +materialized: view
      +schema: STAGING
    refined:
      +materialized: view
      +schema: REFINED
      +tags: ['refined']
    marts:      # Data delivery layer
      portfolio:     # one specific data mart
        +materialized: table
        +schema: MART_PORTFOLIO

snapshots:
  portfolio_tracking_dbt:
    +target_schema: SNAPSHOTS

seeds:
  +schema: seed_data
  portfolio_tracking_dbt:  
    ABC_Bank_SECURITY_INFO:
      +post-hook:
        - "UPDATE {{ this }} SET LOAD_TS = '{{ run_started_at }}' WHERE LOAD_TS is null" # run_started_at - timestamp of the start of the dbt execution expressed in the UTC time zone.
      +column_types:
        LOAD_TS: TIMESTAMP
    ABC_Bank_EXCHANGE_INFO:
      +post-hook:
        - "UPDATE {{ this }} SET LOAD_TS = '{{ run_started_at }}' WHERE LOAD_TS is null" 
      +column_types:
        LOAD_TS: TIMESTAMP
      
