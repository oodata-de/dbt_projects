version: 2

models:
  - name: f_sales_orders
    description: "Fact table for individual sales orders."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
      - name: customer_id
        description: "Unique identifier for the customer."
      - name: order_date
        description: "Date of the order."
      - name: product_id
        description: "Unique identifier for the product."
      - name: quantity
        description: "Quantity ordered."
      - name: amount
        description: "Order amount, NULL if negative."
      - name: is_invalid_amount
        description: "Flag indicating if the amount is invalid (negative)."

  - name: f_daily_sales
    description: "Aggregated daily sales metrics."
    columns:
      - name: order_date
        description: "Date of the sales."
      - name: total_orders
        description: "Total number of distinct orders for the day."
      - name: unique_customers
        description: "Number of unique customers who placed orders."
      - name: total_items_sold
        description: "Total quantity of items sold."
      - name: total_revenue
        description: "Total revenue generated for the day."
